<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="pt-BR">
<head>

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="">
<meta name="author" content="">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<link rel="icon" href="/favicon.ico" type="image/x-icon">

<title>eDist - Licenciamento</title>

<!-- Custom styles for this template -->
<link href="../css/jumbotron-narrow.css" rel="stylesheet">
<link href="../css/bootstrap.css" rel="stylesheet">

<script type="text/javascript" src="../js/jquery-1.10.2.min.cache.js"></script>
<script type="text/javascript" src="../js/bootstrap.min.js"></script>
<script type="text/javascript" src="../js/jquery.validate.js"></script>


<script type='text/javascript' src='admin.js'></script>
<script type='text/javascript' src='dwr/engine.js'></script>
<script type='text/javascript' src='dwr/interface/ManagementService.js'></script>
</head>
<body onload="loadLicences()">

	<div class="container-narrow">

		<div class="header">

			<ul class="nav nav-pills pull-right">
				<li><a href="#add">Adicionar/Editar</a></li>
				<li><a href="#edit">Listar</a></li>
			</ul>
			<h3 class="text-muted">eDist - Licenciamento</h3>
		</div>

		<a name="add"></a>
		<div class="row">
			<form id="add-form" class="form-inline" onsubmit="return false;"
				role="form" action="../add" method="post">
				<fieldset>
					<legend>Adicionar Licença</legend>

					<div class="form-group col-lg-6">
						<input id="appId" name="appId" placeholder="appengine id"
							class="form-control" required type="text" minlength="6">
					</div>


					<div class="form-group col-lg-4">
						<input id="validUntil" name="validUntil"
							placeholder="validade" class="form-control" required
							type="number" step="1" minlength="4">
					</div>

					<!-- Button -->
					<div class="form-group col-lg-2">
						<button id="saveBtn" name="saveBtn" class="btn btn-primary"
							onclick="saveLicence();">Salvar</button>
						<img id="result" src="">
					</div>

				</fieldset>
			</form>
			<script>
				$("#add-form").validate();
			</script>
		</div>
		<hr>
		<a name="edit"></a>
		<div class="row">
			<legend>Listar Licenças</legend>
			<table class="table table-striped table-hover" id="licences">
				<thead>
					<tr>
						<th>Application ID</th>
						<th>Validade</th>
						<th>Data da última alteração</th>
						<th>Usuário</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
		<div class="footer"></div>
	</div>
</body>
</html>
