terms.1 = On the Features
terms.2 = eDist is a Military Unit management sytem for the eRepublik game, that provides supply and player tracking features.
terms.3 = On the Server
terms.4 = eDist can be installed either on the Google AppEngine platform or in a private dedicated server (VPS) that supports the installation of JBoss JBoss and <a href="https://www.jboss.org/capedwarf">CapeDwarf</a>.
terms.5 = In both cases, the payment of server maintenance fees <strong>is the client's responsability.</strong>
terms.6 = The AppEngine platform provides a <a href="https://developers.google.com/appengine/docs/quotas#Resources">free daily quota</a>, and charges <a href="https://developers.google.com/appengine/pricing#cost_resource">only for the over use</a>.
terms.7 = Admin/root access must be provided to the developer for the install of newer versions. For safety reasons, it is optional to remove those permissions during normal use of the application.
terms.8 = The developer is not responsible for possible server downtime, and those do not entitle the client to any fee refunds.
terms.9 = On the Licensing Fees
terms.10 = Each licensed Military Unit is charged an install fee and a monthly maintenance fee.
terms.11 = The install fee varies with the chosen platform and must be paid at the time of the first install/config by the developer, and is not refundable.
terms.12 = The monthly fee varies according to the number of players registered on the system, and must be prepaid on the beginning of each month. It is refundable proportionally to the number of days letf until the end of the license.
terms.13 = A license is valid to only one Military Unit. Shared used between multiple Military Units is not allowed.
terms.14 = Systems that do not keep up with the licence payment will have their features automatically blocked.
terms.15 = The licensing can be cancelled by the client or by the developer with a previous notice of 48h, entitling a refund as above.
terms.16 = On the Software Updates
terms.17 = The monthly fee includes bug fixes and updates to newer software versions.
terms.18 = Software bugs must be reported on the <a href="https://bitbucket.org/marcelofs/edist/issues?status=new&status=open">Issue Tracker</a> and will be corrected in a new version as soon as possible, under the developer's discretion and subject to time and technical considerations.
terms.19 = New features can be requested by the client on the <a href="https://bitbucket.org/marcelofs/edist/issues?status=new&status=open">Issue Tracker</a>. New features can be implemented on future versions, under the developer's discretion and subject to time and technical considerations. It is optional for the developer to charge an additional fee for features considered outside the original scope of the application.
terms.20 = The developer is not liable for the result of software bugs, being the client's responsability to follow the reports to avoid item loss.
terms.21 = On the Terms and Conditions
terms.22 = The use of eDist implies full acceptance of this Terms and Conditions.
terms.23 = Missing circumstances will be judged only and exclusively by the developer.
terms.24 = The Terms and Conditions are subject to change by the developer, with a previous notice of 48h.

