terms.1 = Das Funcionalidades
terms.2 = O eDist é um sistema de gerenciamento de Unidades Militares para o jogo eRepublik, que fornece funcionalidades de distribuição de suprimentos e acompanhamento de jogadores.
terms.3 = Do Servidor
terms.4 = O sistema eDist pode ser instalado tanto na plataforma Google AppEngine quanto em um servidor dedicado (VPS) que suporte a instalação de JBoss e <a href="https://www.jboss.org/capedwarf">CapeDwarf</a>.
terms.5 = Em ambos os casos, o pagamento de possíveis taxas de manutenção do servidor <strong>é de responsabilidade do cliente.</strong>
terms.6 = A plataforma AppEngine fornece uma <a href="https://developers.google.com/appengine/docs/quotas#Resources">quota diária gratuita</a>, e cobra <a href="https://developers.google.com/appengine/pricing#cost_resource">somente o excedente utilizado</a>.
terms.7 = O acesso de administrador/root deve ser fornecido ao desenvolvedor para instalação de novas versões. Por motivos de segurança, é facultativo ao cliente a retirada das permissões durante o uso normal da aplicação.
terms.8 = O desenvolvedor não é responsável por possíveis downtimes no servidor, e os mesmos não intitulam o cliente a ressarcimento da mensalidade.
terms.9 = Dos Custos de Licenciamento
terms.10 = É cobrado de cada Unidade Militar licenciada um valor de instalação do sistema e uma mensalidade de manutenção.
terms.11 = A taxa de instalação varia conforme plataforma escolhida e deve ser paga no momento da primeira instalação/configuração do sistema pelo deselvolvedor, não sendo reembolsável.
terms.12 = A mensalidade tem seu valor variável conforme o número de usuários cadastrados no sistema, e deve ser paga antecipadamente. É reembolsável proporcionalmente ao número de dias restantes até o término da licença.
terms.13 = Uma licença é válida para uma única Unidade Militar. Não é permitido o uso compartilhado de uma mesma licença entre múltiplas Unidades Militares.
terms.14 = Instalações que não estiverem em dia com o pagamento do licenciamento terão suas funcionalidades bloqueadas automaticamente.
terms.15 = O licenciamento pode ser cancelado pelo cliente ou pelo desenvolvedor com aviso prévio de 48h, com direito a reembolso como especificado acima.
terms.16 = Das Atualizações de Software
terms.17 = Está incluída na mensalidade a correção de bugs reportados e atualização para novas versões.
terms.18 = Bugs no software devem ser reportados no <a href="https://bitbucket.org/marcelofs/edist/issues?status=new&status=open">Rastreador</a> e serão corrigidos em nova versão assim que possível, sob critério do desenvolvedor e sujeitos a  limitações de tempo, estruturais e técnicas.
terms.19 = A implementação de novas funcionalidades pode ser requisitada pelo cliente no <a href="https://bitbucket.org/marcelofs/edist/issues?status=new&status=open">Rastreador</a>. Tais funcionalidades poderão sob critério do desenvolvedor ser implementadas em versões futuras, sujeitas a  limitações de tempo, estruturais e técnicas. É‰ facultativo ao desenvolvedor a cobrança de valor adicional pela implementação de funcionalidades consideradas fora do escopo da aplicação.
terms.20 = O desenvolvedor não é responsável pelo resultado de bugs no aplicativo, devendo o cliente acompanhar os relatórios de modo a evitar perda de itens.
terms.21 = Dos Termos e Condições
terms.22 = A utilização do sistema eDist implica na plena aceitação destes Termos e Condições.
terms.23 = Situações omissas dos Termos e Condições serão julgadas única e exclusivamente pelo desenvolvedor.
terms.24 = Os Termos e Condições estão sujeitos a mudanças pelo desenvolvedor, com aviso prévio de 48h.

